<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>আমাদের জয়পুরহাট</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
      opacity: 0.95;
    }

    .hero {
      margin: 15px;
      height: 220px;
      border-radius: 18px;

      background:
        linear-gradient(
          rgba(0,0,0,0.20),
          rgba(0,0,0,0.20)
        ),
        url("./joypurhat.jpg")
        center/cover;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .container {
      padding: 5px 15px 30px;
      max-width: 900px;
      margin: auto;
    }

    .section-title {
      font-size: 20px;
      margin: 18px 0 12px;
      font-weight: bold;
    }

    #categories {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .icon {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 19px;
      margin-bottom: 7px;
      color: #0f766e;
    }

    .card p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .error {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      color: #b91c1c;
    }

    footer {
      margin-top: 30px;
      padding: 25px 15px;
      text-align: center;
      background: #f1f5f9;
      border-top: 1px solid #ddd;
      line-height: 1.7;
    }

    footer a {
      display: inline-block;
      margin: 5px;
      padding: 10px 16px;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .whatsapp {
      background: #25D366;
    }

    .facebook {
      background: #1877F2;
    }

    @media (min-width: 600px) {
      #categories {
        grid-template-columns: repeat(3, 1fr);
      }

      .hero {
        height: 280px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>আমাদের জয়পুরহাট</h1>
    <p>জয়পুরহাট জেলার তথ্যভান্ডার</p>
  </header>


  <!-- জয়পুরহাটের ছবি -->

  <div class="hero"></div>


  <div class="container">

    <div class="section-title">
      📚 বিভাগসমূহ
    </div>

    <div id="categories">

      <div class="loading">
        তথ্য লোড হচ্ছে...
      </div>

    </div>

  </div>


  <footer>

    <div style="font-weight:bold; margin-bottom:10px;">
      © 2026 আমাদের জয়পুরহাট
    </div>

    <div style="font-size:14px; margin-bottom:12px;">
      উপরোক্ত তথ্যে কোনো ভুল বা সংশোধনের প্রয়োজন হলে
      অনুগ্রহ করে যোগাযোগ করুন। যাচাই সাপেক্ষে প্রয়োজনীয়
      সংশোধন করা হবে।
    </div>

    <div style="font-weight:bold;">
      Md. Asib Islam
    </div>

    <div style="font-size:14px;">
      Uchan, Dharanji, Panchbibi, Joypurhat
    </div>

    <div style="margin-top:15px;">

      <a
        class="whatsapp"
        href="https://wa.me/8801319058313"
        target="_blank">
        💬 WhatsApp
      </a>

      <a
        class="facebook"
        href="https://www.facebook.com/Asibislam01"
        target="_blank">
        📘 Facebook
      </a>

    </div>

  </footer>


  <!-- Firebase -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyAG05o2MjHH3UL8Gp7VNmrQGeqq-4YrDEk",

      authDomain:
        "amader-joypurhat-7b3fb.firebaseapp.com",

      projectId:
        "amader-joypurhat-7b3fb",

      storageBucket:
        "amader-joypurhat-7b3fb.firebasestorage.app",

      messagingSenderId:
        "542366008798",

      appId:
        "1:542366008798:web:4f9a7c210b561406a5494f"

    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    async function loadCategories() {

      const container =
        document.getElementById("categories");


      try {

        const snapshot =
          await getDocs(
            collection(db, "categories")
          );


        const categories = [];


        snapshot.forEach((doc) => {

          const data = doc.data();

          categories.push({

            id: doc.id,

            ...data

          });

        });


        /* =========================
           CATEGORY ORDER
           ========================= */

        const orderMap = {

          "জয়পুরহাটের পরিচয়": 1,

          "উপজেলার পরিচয়": 2,

          "দর্শনীয় স্থান": 3

        };


        categories.sort((a, b) => {

          const orderA =
            orderMap[a.name] ?? 999;

          const orderB =
            orderMap[b.name] ?? 999;

          return orderA - orderB;

        });


        container.innerHTML = "";


        if (categories.length === 0) {

          container.innerHTML = `
            <div class="loading">
              কোনো বিভাগ পাওয়া যায়নি।
            </div>
          `;

          return;

        }


        categories.forEach((category) => {

          const card =
            document.createElement("div");


          card.className = "card";


          card.innerHTML = `

            <div class="icon">
              ${category.icon || "📌"}
            </div>

            <h3>
              ${category.name || ""}
            </h3>

            <p>
              ${category.description || ""}
            </p>

          `;


          /* =========================
             CARD CLICK
             ========================= */

          card.onclick = () => {


            /* 🚌 বাসের সময়সূচি */

            if (category.name === "বাসের সময়সূচি") {

              window.location.href =
                "https://www.shohoz.com/bus-tickets";

              return;

            }


            /* 🚆 ট্রেনের সময়সূচি */

            if (category.name === "ট্রেনের সময়সূচি") {

              window.location.href =
                "https://eticket.railway.gov.bd/";

              return;

            }


            /* 📰 আজকের খবর */

            if (category.name === "আজকের খবর") {

              window.location.href =
                "https://www.jagonews24.com/bangladesh/rajshahi/jaipurhat";

              return;

            }


            /* =========================
               অন্যান্য সব Topic
               ========================= */

            window.location.href =
              `topic.html?id=${category.id}`;

          };


          container.appendChild(card);

        });


      } catch (error) {

        console.error(error);


        container.innerHTML = `

          <div class="error">
            তথ্য লোড করা যাচ্ছে না।
          </div>

        `;

      }

    }


    loadCategories();

  </script>

</body>
</html>
