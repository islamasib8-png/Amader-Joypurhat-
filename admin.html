<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - আমাদের জয়পুরহাট</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #0f766e;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .edit,
    .edit-post {
      background: #2563eb;
    }

    .delete,
    .delete-post {
      background: #dc2626;
    }

    .cancel {
      background: #777;
    }

    .logout {
      background: #dc2626;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #f0fdf4;
      color: #166534;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
    }

    .item {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .item strong {
      display: block;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .small {
      color: #555;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* IMAGE POST */

    .post-images {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .post-images img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    .image-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .image-preview img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }

    .post-time {
      color: #777;
      font-size: 13px;
      margin-top: 8px;
    }

    .post-category {
      display: inline-block;
      background: #ecfdf5;
      color: #047857;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    @media (max-width: 500px) {
      .post-images {
        grid-template-columns: 1fr;
      }

      .post-images img {
        height: 220px;
      }

      .image-preview {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🔐 Admin Panel</h1>
  <div>আমাদের জয়পুরহাট</div>
</header>

<div class="container">

  <!-- LOGIN -->

  <div id="loginBox" class="box">

    <h2>Admin Login</h2>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      Login
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel" class="hidden">

    <!-- =========================
         1. ADD TOPIC
    ========================== -->

    <div class="box">

      <h2>➕ নতুন Topic যোগ করুন</h2>

      <label>Topic Name</label>

      <input
        type="text"
        id="categoryName"
        placeholder="যেমন: হাসপাতাল তথ্য"
      >

      <label>Icon</label>

      <input
        type="text"
        id="categoryIcon"
        placeholder="যেমন: 🏥"
      >

      <label>Description</label>

      <textarea
        id="categoryDescription"
        placeholder="Topic সম্পর্কে সংক্ষিপ্ত তথ্য"
      ></textarea>

      <button id="addCategoryBtn">
        Topic যোগ করুন
      </button>

      <div id="categoryMessage"></div>

    </div>


    <!-- =========================
         2. ADD / EDIT CONTENT
    ========================== -->

    <div class="box">

      <h2 id="formTitle">
        📚 নতুন Content যোগ করুন
      </h2>

      <label>Category</label>

      <select id="categorySelect">
        <option value="">
          Topic নির্বাচন করুন
        </option>
      </select>

      <label>Title</label>

      <input
        type="text"
        id="contentTitle"
        placeholder="যেমন: জয়পুরহাট সদর উপজেলা"
      >

      <label>বিস্তারিত তথ্য</label>

      <textarea
        id="contentText"
        placeholder="এখানে বিস্তারিত তথ্য লিখুন"
      ></textarea>

      <label>Image URL (Optional)</label>

      <input
        type="text"
        id="contentImage"
        placeholder="ছবির URL"
      >

      <button id="saveContentBtn">
        Content যোগ করুন
      </button>

      <button
        id="cancelEditBtn"
        class="cancel hidden">
        Edit বাতিল
      </button>

      <div id="contentMessage"></div>

    </div>


    <!-- =========================
         3. IMAGE POST
         ঠিক Content-এর পরেই
    ========================== -->

    <div class="box">

      <h2 id="postFormTitle">
        🖼️ নতুন Image Post যোগ করুন
      </h2>

      <label>Topic</label>

      <select id="postCategorySelect">

        <option value="">
          Topic নির্বাচন করুন
        </option>

      </select>

      <label>Caption</label>

      <textarea
        id="postCaption"
        placeholder="ছবির সাথে যা লিখতে চান..."
      ></textarea>

      <label>
        একাধিক ছবি নির্বাচন করুন
      </label>

      <input
        type="file"
        id="postImages"
        accept="image/*"
        multiple
      >

      <div
        id="imagePreview"
        class="image-preview">
      </div>

      <div id="postMessage"></div>

      <button id="savePostBtn">
        🖼️ Post করুন
      </button>

      <button
        id="cancelPostEditBtn"
        class="cancel hidden">
        Edit বাতিল
      </button>

    </div>


    <!-- =========================
         4. CURRENT CONTENT
    ========================== -->

    <div class="box">

      <h2>
        📋 বর্তমান Content
      </h2>

      <div id="contentList">
        তথ্য লোড হচ্ছে...
      </div>

    </div>


    <!-- =========================
         5. IMAGE POSTS
    ========================== -->

    <div class="box">

      <h2>
        📸 Image Posts
      </h2>

      <div id="postList">
        পোস্ট লোড হচ্ছে...
      </div>

    </div>


    <!-- =========================
         6. LOGOUT
    ========================== -->

    <button
      id="logoutBtn"
      class="logout">
      🔴 Logout
    </button>

  </div>

</div>


<script type="module">

  /* =========================
     FIREBASE IMPORT
  ========================= */

  import {
    initializeApp
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  /* =========================
     FIREBASE CONFIG
  ========================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAG05o2MjHH3UL8Gp7VNmrQGeqq-4YrDEk",

    authDomain:
      "amader-joypurhat-7b3fb.firebaseapp.com",

    projectId:
      "amader-joypurhat-7b3fb",

    storageBucket:
      "amader-joypurhat-7b3fb.firebasestorage.app",

    messagingSenderId:
      "542366008798",

    appId:
      "1:542366008798:web:4f9a7c210b561406a5494f"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);

  const auth =
    getAuth(app);


  /* =========================
     CLOUDINARY
  ========================= */

  const CLOUDINARY_CLOUD_NAME =
    "lkuowv7e";

  const CLOUDINARY_UPLOAD_PRESET =
    "amader_joypurhat_images";

  const CLOUDINARY_UPLOAD_URL =
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;


  /* =========================
     VARIABLES
  ========================= */

  let editingId = null;

  let editingPostId = null;

  let editingPostImages = [];

  let selectedPostFiles = [];

  let categoryCache = {};


  /* =========================
     ELEMENTS
  ========================= */

  const loginBox =
    document.getElementById("loginBox");

  const adminPanel =
    document.getElementById("adminPanel");

  const loginMessage =
    document.getElementById("loginMessage");


  /* =========================
     LOGIN
  ========================= */

  document
    .getElementById("loginBtn")
    .addEventListener(
      "click",
      async function() {

        loginMessage.innerHTML =
          "<div class='message'>Login হচ্ছে...</div>";


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          loginMessage.innerHTML =
            "<div class='message error'>Email ও Password দিন।</div>";

          return;

        }


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          loginMessage.innerHTML =
            "<div class='message'>Login সফল হয়েছে।</div>";


        } catch (error) {

          console.error(error);


          loginMessage.innerHTML =
            "<div class='message error'>Login ব্যর্থ হয়েছে। Email ও Password পরীক্ষা করুন।</div>";

        }

      }
    );


  /* =========================
     AUTH STATE
  ========================= */

  onAuthStateChanged(
    auth,
    async function(user) {

      if (user) {

        loginBox.classList.add("hidden");

        adminPanel.classList.remove("hidden");

        await loadCategories();

        await loadContents();

        await loadPosts();

      } else {

        loginBox.classList.remove("hidden");

        adminPanel.classList.add("hidden");

      }

    }
  );


  /* =========================
     LOGOUT
  ========================= */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      function() {

        signOut(auth);

      }
    );


  /* =========================
     LOAD CATEGORIES
  ========================= */

  async function loadCategories() {

    const select =
      document.getElementById(
        "categorySelect"
      );


    const postSelect =
      document.getElementById(
        "postCategorySelect"
      );


    select.innerHTML =
      "<option value=''>Topic নির্বাচন করুন</option>";


    postSelect.innerHTML =
      "<option value=''>Topic নির্বাচন করুন</option>";


    categoryCache = {};


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "categories"
          )
        );


      snapshot.forEach(
        function(categoryDoc) {

          const data =
            categoryDoc.data();


          const name =
            data.name ||
            "অজানা Topic";


          categoryCache[
            categoryDoc.id
          ] = name;


          const option =
            document.createElement(
              "option"
            );


          option.value =
            categoryDoc.id;


          option.textContent =
            (data.icon || "📌") +
            " " +
            name;


          select.appendChild(
            option
          );


          const postOption =
            document.createElement(
              "option"
            );


          postOption.value =
            categoryDoc.id;


          postOption.textContent =
            (data.icon || "📌") +
            " " +
            name;


          postSelect.appendChild(
            postOption
          );

        }
      );


    } catch (error) {

      console.error(error);


      document
        .getElementById("categoryMessage")
        .innerHTML =
        "<div class='message error'>Topic লোড করা যায়নি।</div>";

    }

  }


  /* =========================
     ADD CATEGORY
  ========================= */

  document
    .getElementById("addCategoryBtn")
    .addEventListener(
      "click",
      async function() {

        const name =
          document
            .getElementById(
              "categoryName"
            )
            .value
            .trim();


        const icon =
          document
            .getElementById(
              "categoryIcon"
            )
            .value
            .trim();


        const description =
          document
            .getElementById(
              "categoryDescription"
            )
            .value
            .trim();


        const message =
          document.getElementById(
            "categoryMessage"
          );


        if (!name) {

          message.innerHTML =
            "<div class='message error'>Topic Name দিন।</div>";

          return;

        }


        try {

          await addDoc(
            collection(
              db,
              "categories"
            ),
            {
              name: name,
              icon: icon,
              description: description
            }
          );


          document
            .getElementById(
              "categoryName"
            )
            .value = "";


          document
            .getElementById(
              "categoryIcon"
            )
            .value = "";


          document
            .getElementById(
              "categoryDescription"
            )
            .value = "";


          message.innerHTML =
            "<div class='message'>Topic যোগ হয়েছে।</div>";


          await loadCategories();


        } catch (error) {

          console.error(error);


          message.innerHTML =
            "<div class='message error'>Topic যোগ করা যায়নি।</div>";

        }

      }
    );


  /* =========================
     SAVE CONTENT
  ========================= */

  document
    .getElementById("saveContentBtn")
    .addEventListener(
      "click",
      async function() {

        const categoryId =
          document
            .getElementById(
              "categorySelect"
            )
            .value;


        const title =
          document
            .getElementById(
              "contentTitle"
            )
            .value
            .trim();


        const content =
          document
            .getElementById(
              "contentText"
            )
            .value
            .trim();


        const image =
          document
            .getElementById(
              "contentImage"
            )
            .value
            .trim();


        const message =
          document.getElementById(
            "contentMessage"
          );


        if (
          !categoryId ||
          !title ||
          !content
        ) {

          message.innerHTML =
            "<div class='message error'>Topic, Title এবং বিস্তারিত তথ্য দিন।</div>";

          return;

        }


        try {

          if (editingId) {

            await updateDoc(
              doc(
                db,
                "contents",
                editingId
              ),
              {
                categoryId:
                  categoryId,

                title:
                  title,

                content:
                  content,

                image:
                  image
              }
            );


            message.innerHTML =
              "<div class='message'>Content Update হয়েছে।</div>";


          } else {

            await addDoc(
              collection(
                db,
                "contents"
              ),
              {
                categoryId:
                  categoryId,

                title:
                  title,

                content:
                  content,

                image:
                  image
              }
            );


            message.innerHTML =
              "<div class='message'>Content যোগ হয়েছে।</div>";

          }


          clearForm();

          await loadContents();


        } catch (error) {

          console.error(error);


          message.innerHTML =
            "<div class='message error'>Content Save করা যায়নি।</div>";

        }

      }
    );


  /* =========================
     LOAD CONTENTS
  ========================= */

  async function loadContents() {

    const list =
      document.getElementById(
        "contentList"
      );


    list.innerHTML =
      "তথ্য লোড হচ্ছে...";


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "contents"
          )
        );


      list.innerHTML = "";


      if (snapshot.empty) {

        list.innerHTML =
          "<div class='message'>কোনো Content নেই।</div>";

        return;

      }


      snapshot.forEach(
        function(contentDoc) {

          const data =
            contentDoc.data();


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "item";


          item.innerHTML = `

            <strong>
              ${escapeHTML(
                data.title || ""
              )}
            </strong>

            <div class="small">
              ${escapeHTML(
                data.content || ""
              )}
            </div>

            <button
              class="edit"
              data-id="${contentDoc.id}">
              ✏️ Edit
            </button>

            <button
              class="delete"
              data-id="${contentDoc.id}">
              🗑️ Delete
            </button>

          `;


          list.appendChild(item);

        }
      );


      list
        .querySelectorAll(".edit")
        .forEach(
          function(button) {

            button.addEventListener(
              "click",
              function() {

                editContent(
                  button.dataset.id
                );

              }
            );

          }
        );


      list
        .querySelectorAll(".delete")
        .forEach(
          function(button) {

            button.addEventListener(
              "click",
              async function() {

                if (
                  !confirm(
                    "এই Content Delete করবেন?"
                  )
                ) {

                  return;

                }


                try {

                  await deleteDoc(
                    doc(
                      db,
                      "contents",
                      button.dataset.id
                    )
                  );


                  await loadContents();


                } catch (error) {

                  console.error(
                    error
                  );


                  alert(
                    "Delete করা যায়নি।"
                  );

                }

              }
            );

          }
        );


    } catch (error) {

      console.error(error);


      list.innerHTML =
        "<div class='message error'>Content লোড করা যায়নি।</div>";

    }

  }


  /* =========================
     EDIT CONTENT
  ========================= */

  async function editContent(id) {

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "contents"
          )
        );


      let data = null;


      snapshot.forEach(
        function(contentDoc) {

          if (
            contentDoc.id === id
          ) {

            data =
              contentDoc.data();

          }

        }
      );


      if (!data) {

        alert(
          "Content পাওয়া যায়নি।"
        );

        return;

      }


      editingId = id;


      document
        .getElementById(
          "categorySelect"
        )
        .value =
        data.categoryId || "";


      document
        .getElementById(
          "contentTitle"
        )
        .value =
        data.title || "";


      document
        .getElementById(
          "contentText"
        )
        .value =
        data.content || "";


      document
        .getElementById(
          "contentImage"
        )
        .value =
        data.image || "";


      document
        .getElementById(
          "formTitle"
        )
        .textContent =
        "✏️ Content Edit করুন";


      document
        .getElementById(
          "saveContentBtn"
        )
        .textContent =
        "Update করুন";


      document
        .getElementById(
          "cancelEditBtn"
        )
        .classList
        .remove("hidden");


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });


    } catch (error) {

      console.error(error);

    }

  }


  /* =========================
     CANCEL CONTENT EDIT
  ========================= */

  document
    .getElementById(
      "cancelEditBtn"
    )
    .addEventListener(
      "click",
      function() {

        clearForm();

      }
    );


  /* =========================
     CLEAR CONTENT FORM
  ========================= */

  function clearForm() {

    editingId = null;


    document
      .getElementById(
        "categorySelect"
      )
      .value = "";


    document
      .getElementById(
        "contentTitle"
      )
      .value = "";


    document
      .getElementById(
        "contentText"
      )
      .value = "";


    document
      .getElementById(
        "contentImage"
      )
      .value = "";


    document
      .getElementById(
        "formTitle"
      )
      .textContent =
      "📚 নতুন Content যোগ করুন";


    document
      .getElementById(
        "saveContentBtn"
      )
      .textContent =
      "Content যোগ করুন";


    document
      .getElementById(
        "cancelEditBtn"
      )
      .classList
      .add("hidden");

  }


  /* =====================================================
     IMAGE POST SYSTEM
  ===================================================== */


  /* =========================
     IMAGE SELECT
  ========================= */

  document
    .getElementById(
      "postImages"
    )
    .addEventListener(
      "change",
      function(event) {

        selectedPostFiles =
          Array.from(
            event.target.files || []
          );


        showImagePreview();

      }
    );


  /* =========================
     IMAGE PREVIEW
  ========================= */

  function showImagePreview() {

    const preview =
      document.getElementById(
        "imagePreview"
      );


    preview.innerHTML = "";


    selectedPostFiles.forEach(
      function(file) {

        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            const img =
              document.createElement(
                "img"
              );


            img.src =
              event.target.result;


            preview.appendChild(
              img
            );

          };


        reader.readAsDataURL(file);

      }
    );

  }


  /* =========================
     CLOUDINARY UPLOAD
  ========================= */

  async function uploadImageToCloudinary(
    file
  ) {

    const formData =
      new FormData();


    formData.append(
      "file",
      file
    );


    formData.append(
      "upload_preset",
      CLOUDINARY_UPLOAD_PRESET
    );


    const response =
      await fetch(
        CLOUDINARY_UPLOAD_URL,
        {
          method: "POST",
          body: formData
        }
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.secure_url
    ) {

      console.error(
        "Cloudinary error:",
        result
      );


      throw new Error(
        "ছবি Upload করা যায়নি। Cloudinary সেটিং পরীক্ষা করুন।"
      );

    }


    return result.secure_url;

  }


  /* =========================
     SAVE IMAGE POST
  ========================= */

  document
    .getElementById(
      "savePostBtn"
    )
    .addEventListener(
      "click",
      async function() {

        const button =
          document.getElementById(
            "savePostBtn"
          );


        const message =
          document.getElementById(
            "postMessage"
          );


        const categoryId =
          document
            .getElementById(
              "postCategorySelect"
            )
            .value;


        const caption =
          document
            .getElementById(
              "postCaption"
            )
            .value
            .trim();


        if (!categoryId) {

          message.innerHTML =
            "<div class='message error'>Topic নির্বাচন করুন।</div>";

          return;

        }


        if (!caption) {

          message.innerHTML =
            "<div class='message error'>Caption লিখুন।</div>";

          return;

        }


        if (
          !editingPostId &&
          selectedPostFiles.length === 0
        ) {

          message.innerHTML =
            "<div class='message error'>কমপক্ষে ১টি ছবি নির্বাচন করুন।</div>";

          return;

        }


        try {

          button.disabled = true;


          /* =====================
             EDIT POST
          ===================== */

          if (editingPostId) {

            message.innerHTML =
              "<div class='message'>Post Update হচ্ছে...</div>";


            let finalImages =
              editingPostImages.slice();


            if (
              selectedPostFiles.length > 0
            ) {

              message.innerHTML =
                "<div class='message'>নতুন ছবি Upload হচ্ছে...</div>";


              const newImages =
                await Promise.all(
                  selectedPostFiles.map(
                    uploadImageToCloudinary
                  )
                );


              finalImages =
                newImages;

            }


            await updateDoc(
              doc(
                db,
                "posts",
                editingPostId
              ),
              {
                categoryId:
                  categoryId,

                caption:
                  caption,

                images:
                  finalImages
              }
            );


            message.innerHTML =
              "<div class='message'>Image Post Update হয়েছে।</div>";


          } else {

            /* =====================
               NEW POST
            ===================== */

            message.innerHTML =
              "<div class='message'>ছবি Upload হচ্ছে... একটু অপেক্ষা করুন।</div>";


            const imageUrls =
              await Promise.all(
                selectedPostFiles.map(
                  uploadImageToCloudinary
                )
              );


            message.innerHTML =
              "<div class='message'>Post তৈরি হচ্ছে...</div>";


            await addDoc(
              collection(
                db,
                "posts"
              ),
              {
                categoryId:
                  categoryId,

                caption:
                  caption,

                images:
                  imageUrls,

                createdAt:
                  serverTimestamp()
              }
            );


            message.innerHTML =
              "<div class='message'>Image Post সফলভাবে যোগ হয়েছে।</div>";

          }


          clearPostForm();

          await loadPosts();


        } catch (error) {

          console.error(
            error
          );


          message.innerHTML =
            "<div class='message error'>" +
            escapeHTML(
              error.message ||
              "Post Save করা যায়নি।"
            ) +
            "</div>";


        } finally {

          button.disabled = false;

        }

      }
    );


  /* =========================
     LOAD POSTS
  ========================= */

  async function loadPosts() {

    const list =
      document.getElementById(
        "postList"
      );


    list.innerHTML =
      "পোস্ট লোড হচ্ছে...";


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "posts"
          )
        );


      const posts = [];


      snapshot.forEach(
        function(postDoc) {

          const data =
            postDoc.data();


          posts.push({
            id:
              postDoc.id,

            ...data
          });

        }
      );


      /* NEWEST FIRST */

      posts.sort(
        function(a, b) {

          const aTime =
            a.createdAt &&
            typeof a.createdAt.toMillis ===
            "function"
              ? a.createdAt.toMillis()
              : 0;


          const bTime =
            b.createdAt &&
            typeof b.createdAt.toMillis ===
            "function"
              ? b.createdAt.toMillis()
              : 0;


          return bTime - aTime;

        }
      );


      list.innerHTML = "";


      if (posts.length === 0) {

        list.innerHTML =
          "<div class='message'>কোনো Image Post নেই।</div>";

        return;

      }


      posts.forEach(
        function(post) {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "item";


          const categoryName =
            getCategoryName(
              post.categoryId
            );


          const images =
            Array.isArray(
              post.images
            )
              ? post.images
              : [];


          const imageHTML =
            images
              .map(
                function(url) {

                  return `
                    <img
                      src="${escapeAttribute(url)}"
                      alt="Post Image"
                      loading="lazy">
                  `;

                }
              )
              .join("");


          const time =
            formatPostTime(
              post.createdAt
            );


          item.innerHTML = `

            <div class="post-category">
              📂 ${escapeHTML(
                categoryName
              )}
            </div>

            <div class="small">
              ${escapeHTML(
                post.caption || ""
              )}
            </div>

            ${
              images.length > 0
                ? `
                  <div class="post-images">
                    ${imageHTML}
                  </div>
                `
                : ""
            }

            <div class="post-time">
              🕐 ${time}
            </div>

            <button
              class="edit-post"
              data-id="${post.id}">
              ✏️ Edit Post
            </button>

            <button
              class="delete-post"
              data-id="${post.id}">
              🗑️ Delete Post
            </button>

          `;


          list.appendChild(
            item
          );

        }
      );


      /* EDIT POST */

      list
        .querySelectorAll(
          ".edit-post"
        )
        .forEach(
          function(button) {

            button.addEventListener(
              "click",
              function() {

                editPost(
                  button.dataset.id
                );

              }
            );

          }
        );


      /* DELETE POST */

      list
        .querySelectorAll(
          ".delete-post"
        )
        .forEach(
          function(button) {

            button.addEventListener(
              "click",
              async function() {

                if (
                  !confirm(
                    "এই Image Post Delete করবেন?"
                  )
                ) {

                  return;

                }


                try {

                  await deleteDoc(
                    doc(
                      db,
                      "posts",
                      button.dataset.id
                    )
                  );


                  await loadPosts();


                } catch (error) {

                  console.error(
                    error
                  );


                  alert(
                    "Post Delete করা যায়নি।"
                  );

                }

              }
            );

          }
        );


    } catch (error) {

      console.error(
        error
      );


      list.innerHTML =
        "<div class='message error'>Image Post লোড করা যায়নি।</div>";

    }

  }


  /* =========================
     CATEGORY NAME
  ========================= */

  function getCategoryName(id) {

    return (
      categoryCache[id] ||
      "অজানা Topic"
    );

  }


  /* =========================
     EDIT POST
  ========================= */

  async function editPost(id) {

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "posts"
          )
        );


      let data = null;


      snapshot.forEach(
        function(postDoc) {

          if (
            postDoc.id === id
          ) {

            data =
              postDoc.data();

          }

        }
      );


      if (!data) {

        alert(
          "Post পাওয়া যায়নি।"
        );

        return;

      }


      editingPostId =
        id;


      editingPostImages =
        Array.isArray(
          data.images
        )
          ? data.images.slice()
          : [];


      selectedPostFiles =
        [];


      document
        .getElementById(
          "postCategorySelect"
        )
        .value =
        data.categoryId || "";


      document
        .getElementById(
          "postCaption"
        )
        .value =
        data.caption || "";


      document
        .getElementById(
          "postImages"
        )
        .value = "";


      document
        .getElementById(
          "imagePreview"
        )
        .innerHTML =
        editingPostImages
          .map(
            function(url) {

              return `
                <img
                  src="${escapeAttribute(url)}"
                  alt="Current Image">
              `;

            }
          )
          .join("");


      document
        .getElementById(
          "postFormTitle"
        )
        .textContent =
        "✏️ Image Post Edit করুন";


      document
        .getElementById(
          "savePostBtn"
        )
        .textContent =
        "Update Post করুন";


      document
        .getElementById(
          "cancelPostEditBtn"
        )
        .classList
        .remove("hidden");


      const postForm =
        document.getElementById(
          "postFormTitle"
        );


      window.scrollTo({
        top:
          postForm.getBoundingClientRect()
            .top +
          window.scrollY -
          20,

        behavior:
          "smooth"
      });


    } catch (error) {

      console.error(
        error
      );


      alert(
        "Post Edit করা যায়নি।"
      );

    }

  }


  /* =========================
     CANCEL POST EDIT
  ========================= */

  document
    .getElementById(
      "cancelPostEditBtn"
    )
    .addEventListener(
      "click",
      function() {

        clearPostForm();

      }
    );


  /* =========================
     CLEAR POST FORM
  ========================= */

  function clearPostForm() {

    editingPostId =
      null;


    editingPostImages =
      [];


    selectedPostFiles =
      [];


    document
      .getElementById(
        "postCategorySelect"
      )
      .value = "";


    document
      .getElementById(
        "postCaption"
      )
      .value = "";


    document
      .getElementById(
        "postImages"
      )
      .value = "";


    document
      .getElementById(
        "imagePreview"
      )
      .innerHTML = "";


    document
      .getElementById(
        "postFormTitle"
      )
      .textContent =
      "🖼️ নতুন Image Post যোগ করুন";


    document
      .getElementById(
        "savePostBtn"
      )
      .textContent =
      "🖼️ Post করুন";


    document
      .getElementById(
        "cancelPostEditBtn"
      )
      .classList
      .add("hidden");

  }


  /* =========================
     TIME FORMAT
  ========================= */

  function formatPostTime(
    timestamp
  ) {

    if (
      !timestamp ||
      typeof timestamp.toDate !==
      "function"
    ) {

      return "এইমাত্র";

    }


    const date =
      timestamp.toDate();


    return date.toLocaleString(
      "bn-BD",
      {
        year:
          "numeric",

        month:
          "long",

        day:
          "numeric",

        hour:
          "numeric",

        minute:
          "2-digit"
      }
    );

  }


  /* =========================
     SECURITY HELPERS
  ========================= */

  function escapeHTML(
    value
  ) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(
    value
  ) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      );

  }

</script>
