<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - আমাদের জয়পুরহাট</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #0f766e;
      color: white;
    }

    button.edit {
      background: #2563eb;
    }

    button.delete {
      background: #dc2626;
    }

    button.cancel {
      background: #777;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #f0fdf4;
      color: #166534;
    }

    .item {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
    }

    .item strong {
      display: block;
      margin-bottom: 7px;
      font-size: 17px;
    }

    .small {
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<header>
  <h1>🔐 Admin Panel</h1>
  <p>আমাদের জয়পুরহাট</p>
</header>

<div class="container">

  <!-- LOGIN -->

  <div id="loginBox" class="box">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input type="email" id="email" placeholder="Admin Email">

    <label>Password</label>
    <input type="password" id="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel" class="hidden">

    <!-- CATEGORY -->

    <div class="box">

      <h2>➕ নতুন Topic যোগ করুন</h2>

      <label>Topic Name</label>
      <input type="text" id="categoryName"
             placeholder="যেমন: হাসপাতাল তথ্য">

      <label>Icon</label>
      <input type="text" id="categoryIcon"
             placeholder="যেমন: 🏥">

      <label>Description</label>
      <textarea id="categoryDescription"
                placeholder="Topic সম্পর্কে সংক্ষিপ্ত তথ্য"></textarea>

      <button id="addCategoryBtn">
        Topic যোগ করুন
      </button>

      <div id="categoryMessage"></div>

    </div>


    <!-- CONTENT ADD / EDIT -->

    <div class="box">

      <h2 id="contentFormTitle">
        📚 নতুন Content যোগ করুন
      </h2>

      <label>Category নির্বাচন</label>

      <select id="categorySelect">
        <option value="">Topic নির্বাচন করুন</option>
      </select>


      <label>Title</label>

      <input type="text"
             id="contentTitle"
             placeholder="যেমন: জয়পুরহাট সদর উপজেলা">


      <label>Content</label>

      <textarea id="contentText"
                placeholder="এখানে বিস্তারিত তথ্য লিখুন"></textarea>


      <label>Image URL (Optional)</label>

      <input type="text"
             id="contentImage"
             placeholder="ছবির URL">


      <button id="saveContentBtn">
        Content যোগ করুন
      </button>

      <button id="cancelEditBtn"
              class="cancel hidden
