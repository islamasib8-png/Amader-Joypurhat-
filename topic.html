/* =========================
   TIME
========================= */

function formatPostTime(timestamp){

if(!timestamp){
return "";
}

try{

let date;

if(
timestamp &&
typeof timestamp.toDate ===
"function"
){

date =
timestamp.toDate();

}

else if(
timestamp.seconds
){

date =
new Date(
timestamp.seconds * 1000
);

}

else{

date =
new Date(timestamp);

}

if(
isNaN(
date.getTime()
)
){

return "";

}

return date.toLocaleString(
"bn-BD",
{
year:"numeric",
month:"long",
day:"numeric",
hour:"numeric",
minute:"2-digit"
}
);

}
catch(error){

return "";

}

}

async function loadBloodDonors(){

const bloodDonors =
document.getElementById(
"bloodDonors"
);


bloodDonors.innerHTML =
"";


try{

const snapshot =
await getDocs(
collection(
db,
"submissions"
)
);


const donors = [];


snapshot.forEach(
function(donorDoc){

const data =
donorDoc.data();


/*
শুধু blood + approved
*/

if(
data.type === "blood" &&
data.status === "approved"
){

donors.push({

id:
donorDoc.id,

...data

});

}

});


/*
নতুন approved donor আগে
*/

donors.sort(
function(a,b){

const aTime =
a.createdAt &&
typeof a.createdAt.toMillis ===
"function"
?
a.createdAt.toMillis()
:
0;

const bTime =
b.createdAt &&
typeof b.createdAt.toMillis ===
"function"
?
b.createdAt.toMillis()
:
0;

return bTime-aTime;

}
);


if(
donors.length === 0
){

bloodDonors.innerHTML = `

<div class="blood-section-title">

🩸 রক্তদাতা

</div>

<div class="loading">

বর্তমানে কোনো অনুমোদিত রক্তদাতার তথ্য নেই।

</div>

`;

return;

}


bloodDonors.innerHTML = `

<div class="blood-section-title">

🩸 রক্তদাতা তালিকা

</div>

`;


donors.forEach(
function(donor){

const card =
document.createElement(
"div"
);

card.className =
"blood-card";


card.innerHTML = `

<div class="blood-group">

🩸 ${escapeHTML(
donor.bloodGroup ||
""
)}

</div>

<div class="blood-name">

${escapeHTML(
donor.name ||
""
)}

</div>

<div class="blood-info">

📍 <b>ঠিকানা:</b>
${escapeHTML(
donor.address ||
""
)}

</div>

<div class="blood-mobile">

📱 <b>মোবাইল:</b>
${escapeHTML(
donor.mobile ||
""
)}

</div>

`;

bloodDonors.appendChild(
card
);

});


}
catch(error){

console.error(
"Blood Donor Error:",
error
);

bloodDonors.innerHTML = "";

}

}

async function loadApprovedSubmissions(){

const box =
document.getElementById(
"approvedSubmissions"
);

box.innerHTML = "";


if(!categoryId){
return;
}


try{

const snapshot =
await getDocs(
collection(
db,
"submissions"
)
);


const submissions = [];


snapshot.forEach(
function(submissionDoc){

const data =
submissionDoc.data();


/*
শুধু APPROVED এবং
এই Topic-এর submission
*/

const sameCategory =
String(
data.categoryId || ""
).trim()
===
String(
categoryId
).trim();


if(
data.status === "approved" &&
sameCategory
){

/*
Blood donor আলাদাভাবে
দেখানো হচ্ছে
*/

if(
data.type === "blood"
){

return;

}


submissions.push({

id:
submissionDoc.id,

...data

});

}

});


/*
নতুন submission আগে
*/

submissions.sort(
function(a,b){

const aTime =
a.createdAt &&
typeof a.createdAt.toMillis ===
"function"
?
a.createdAt.toMillis()
:
0;

const bTime =
b.createdAt &&
typeof b.createdAt.toMillis ===
"function"
?
b.createdAt.toMillis()
:
0;

return bTime-aTime;

}
);


if(
submissions.length === 0
){

return;

}


box.innerHTML = `

<div class="submission-section-title">

📋 অনুমোদিত তথ্য

</div>

`;


submissions.forEach(
function(item){

const card =
document.createElement(
"div"
);

card.className =
"submission-card";


/*
Title
*/

const title =
item.title ||
item.name ||
item.businessName ||
item.institutionName ||
item.restaurantName ||

/*
Details / Content
*/

const details =
item.details ||
item.description ||
item.content ||
item.info ||
"";


let html = `

<div class="submission-title">

${escapeHTML(title)}

</div>

Name

){

html += `

<div class="submission-row">

👤 <b>নাম:</b>
${escapeHTML(item.name)}

</div>

}


/*
Address
*/

if(item.address){

html += `

<div class="submission-row">

📍 <b>ঠিকানা:</b>
${escapeHTML(item.address)}

</div>

`;

}


/*
Mobile
*/

if(item.mobile){

html += `

<div class="submission-row">

📱 <b>মোবাইল:</b>
${escapeHTML(item.mobile)}

</div>

`;

}


/*
Phone
*/

if(
item.phone &&
item.phone !== item.mobile
){

html += `

<div class="submission-row">

☎️ <b>ফোন:</b>
${escapeHTML(item.phone)}

</div>

`;

}


/*
Email
*/

if(item.email){

html += `

<div class="submission-row">

✉️ <b>ই-মেইল:</b>
${escapeHTML(item.email)}

</div>

`;

}


/*
Blood Group
*/

if(item.bloodGroup){

html += `

<div class="submission-row">

🩸 <b>রক্তের গ্রুপ:</b>
${escapeHTML(item.bloodGroup)}

</div>

`;

}


/*
Upazila
*/

if(item.upazila){

html += `

<div class="submission-row">

🏘️ <b>উপজেলা:</b>

Details

Created time
*/

});


}
catch(error){

console.error(
"Approved Submission Error:",
error
);

box.innerHTML = "";

async function loadImagePosts(){

const imagePosts =
document.getElementById(
"imagePosts"
);

imagePosts.innerHTML =
"";


if(!categoryId){
return;
}


try{

const postsSnapshot =
await getDocs(
collection(
db,
"posts"
)
);


const posts = [];


postsSnapshot.forEach(
function(postDoc){

const data =
postDoc.data();


if(
String(
data.categoryId || ""
).trim()
===
String(
categoryId
).trim()
){

posts.push({

id:
postDoc.id,

...data

});

}

});


posts.sort(
function(a,b){

let dateA = 0;
let dateB = 0;


if(
a.createdAt &&
typeof a.createdAt.toMillis ===
"function"
){

dateA =
a.createdAt.toMillis();

}


if(
b.createdAt &&
typeof b.createdAt.toMillis ===
"function"
){

dateB =
b.createdAt.toMillis();

}


return dateB-dateA;

}
);


if(
posts.length === 0
){

return;

}


imagePosts.innerHTML = `

<div class="posts-section-title">

🖼️ Image Posts

</div>

`;


posts.forEach(
function(post){

const card =
document.createElement(
"div"
);

card.className =
"post-card";


let images =
post.images || [];


if(
!Array.isArray(images)
){

images =
[images];

}


const validImages =
images.filter(
function(url){

return (
typeof url === "string" &&
url.trim() !== ""
);

}
);


let imagesHTML = "";


validImages.forEach(
function(url){

imagesHTML += `

<img
src="${escapeAttribute(url)}"
alt="আমাদের জয়পুরহাট"
loading="lazy"
onerror="this.style.display='none';">

`;

});


const caption =
post.caption || "";


const postTime =
formatPostTime(
post.createdAt
);


card.innerHTML = `

${
imagesHTML
?
`
<div class="post-images">

${imagesHTML}

</div>
`
:
""
}

${
caption
?
`
<div class="post-caption">

${escapeHTML(caption)}

</div>
`
:
""
}

${
postTime
?
`
<div class="post-time">

🕐 ${postTime}

</div>
`
:
""
}

`;


imagePosts.appendChild(
card
);

});

}
catch(error){

console.error(
"Image Posts Error:",
error
);

}

}

/* =====================================================
   CREATE SECTIONS
===================================================== */

function createSections(
container,
text
){

const sections =
text
.replace(
/\r\n/g,
"\n"
)
.split(
/\n\s*\n/
)
.map(
function(section){

return section.trim();

}
)
.filter(
function(section){

return section.length > 0;

}
);


sections.forEach(
function(section){

const lines =
section.split(
"\n"
);


const heading =
lines[0].trim();


const body =
lines
.slice(1)
.join("\n")
.trim();


const card =
document.createElement(
"div"
);

card.className =
"info-section";


const linkedBody =
makePhoneLinks(
body
);


card.innerHTML = `

<div class="info-heading">

${escapeHTML(
heading
)}

</div>

${
body
?
`
<div class="info-text">

${escapeHTML(
linkedBody
)}

</div>
`
:
""
}

`;


container.appendChild(
card
);

});

}

/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

return String(value || "")
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


function escapeAttribute(value){

return String(value || "")
.replace(
/&/g,
"&amp;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
);

}
