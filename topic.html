/* ================= WEBSITE LINKS ================= */

function makePhoneLinks(text){

let safeText =
escapeHTML(text || "");


safeText =
safeText.replace(
/(https?:\/\/[^\s<]+)/g,
function(url){

let cleanUrl = url;
let ending = "";

while(
cleanUrl.length > 0 &&
/[.,!?;:)\]}]$/.test(cleanUrl)
){

ending =
cleanUrl.slice(-1)
+
ending;

cleanUrl =
cleanUrl.slice(0,-1);

}


return `
<a
href="${escapeAttribute(cleanUrl)}"
target="_blank"
rel="noopener noreferrer">

${cleanUrl}

</a>${ending}
`;

}
);


return safeText;

}


/* ================= TIME ================= */

function formatPostTime(timestamp){

if(!timestamp){
return "";
}

try{

let date;

if(
timestamp &&
typeof timestamp.toDate ===
"function"
){

date =
timestamp.toDate();

}
else if(
timestamp.seconds
){

date =
new Date(
timestamp.seconds * 1000
);

}
else{

date =
new Date(timestamp);

}

if(
isNaN(date.getTime())
){

return "";

}

return date.toLocaleString(
"bn-BD",
{
year:"numeric",
month:"long",
day:"numeric",
hour:"numeric",
minute:"2-digit"
}
);

}
catch(error){

return "";

}

}

async function loadBloodDonors(){

const bloodDonors =
document.getElementById(
"bloodDonors"
);

bloodDonors.innerHTML = "";


if(!categoryId){
return;
}


try{

const snapshot =
await getDocs(
collection(
db,
"submissions"
)
);


const donors = [];


snapshot.forEach(
function(donorDoc){

const data =
donorDoc.data();


/*
   নতুন ডেটা:
   categoryId অবশ্যই বর্তমান Topic-এর সাথে
   মিলতে হবে।

   পুরোনো রক্তদাতা:
   যদি categoryId না থাকে, তাহলে শুধু
   "রক্তদাতা" Topic-এ দেখানো হবে।
*/

const hasCategoryId =
String(
data.categoryId || ""
).trim() !== "";


const sameCategory =
String(
data.categoryId || ""
).trim()
===
String(
categoryId || ""
).trim();


const oldBloodDonor =
data.type === "blood" &&
data.status === "approved" &&
!hasCategoryId;


const newBloodDonor =
data.type === "blood" &&
data.status === "approved" &&
sameCategory;


if(
oldBloodDonor ||
newBloodDonor
){

donors.push({

id:donorDoc.id,

...data

});

}

});


donors.sort(
function(a,b){

const aTime =
a.createdAt &&
typeof a.createdAt.toMillis ===
"function"
?
a.createdAt.toMillis()
:
0;

const bTime =
b.createdAt &&
typeof b.createdAt.toMillis ===
"function"
?
b.createdAt.toMillis()
:
0;

return bTime-aTime;

}
);


if(
donors.length === 0
){

bloodDonors.innerHTML = `

<div class="blood-section-title">

🩸 রক্তদাতা

</div>

<div class="loading">

বর্তমানে কোনো অনুমোদিত রক্তদাতার তথ্য নেই।

function(donor){

document.createElement(
"div"
);

"blood-card";


card.innerHTML = `

<div class="blood-group">

🩸 ${escapeHTML(
donor.bloodGroup || ""
)}

</div>

<div class="blood-name">

${escapeHTML(
donor.name || ""
)}

</div>

<div class="blood-info">

📍 <b>ঠিকানা:</b>
${escapeHTML(
donor.address || ""
)}

</div>

<div class="blood-mobile">

📱 <b>মোবাইল:</b>
${escapeHTML(
donor.mobile || ""
)}

</div>

`;

});

catch(error){

"Blood Donor Error:",

async function loadImagePosts(){

const imagePosts =
document.getElementById(
"imagePosts"
);

imagePosts.innerHTML = "";


if(!categoryId){
return;
}


try{

const postsSnapshot =
await getDocs(
collection(
db,
"posts"
)
);


const posts = [];


postsSnapshot.forEach(
function(postDoc){

const data =
postDoc.data();


const sameCategory =
String(
data.categoryId || ""
).trim()
===
String(
categoryId || ""
).trim();


if(
sameCategory
){

posts.push({

id:postDoc.id,

...data

});

}

});


posts.sort(
function(a,b){

let dateA = 0;
let dateB = 0;


if(
a.createdAt &&
typeof a.createdAt.toMillis ===
"function"
){

dateA =
a.createdAt.toMillis();

}


if(
b.createdAt &&
typeof b.createdAt.toMillis ===
"function"
){

dateB =
b.createdAt.toMillis();

}


return dateB-dateA;

}
);


if(
posts.length === 0
){

return;

}


imagePosts.innerHTML = `

<div class="posts-section-title">

🖼️ Image Posts

</div>

`;


posts.forEach(
function(post){

const card =
document.createElement(
"div"
);

card.className =
"post-card";


let images =
post.images || [];


if(
!Array.isArray(images)
){

images =
[images];

}


const validImages =
images.filter(
function(url){

return (
typeof url === "string" &&
url.trim() !== ""
);

}
);


let imagesHTML = "";


validImages.forEach(
function(url){

imagesHTML += `

<img
src="${escapeAttribute(url)}"
alt="আমাদের জয়পুরহাট"
loading="lazy"
onerror="this.style.display='none';">

`;

});


const caption =
post.caption || "";


const postTime =
formatPostTime(
post.createdAt
);


card.innerHTML = `

${
imagesHTML
?
`
<div class="post-images">

${imagesHTML}

</div>
`
:
""
}

${
caption
?
`
<div class="post-caption">

${makePhoneLinks(caption)}

</div>
`
:
""
}

${
postTime
?
`
<div class="post-time">

🕐 ${postTime}

</div>
`
:
""
}

`;

imagePosts.appendChild(card);

});

}
catch(error){

console.error(
"Image Posts Error:",
error
);

}

}

/* ================================================= */
/* ================= CREATE SECTIONS =============== */
/* ================================================= */

function createSections(
container,
text
){

const sections =
text
.replace(
/\r\n/g,
"\n"
)
.split(
/\n\s*\n/
)
.map(
function(section){

return section.trim();

}
)
.filter(
function(section){

return section.length > 0;

}
);


sections.forEach(
function(section){

const lines =
section.split("\n");


const heading =
lines[0].trim();


const body =
lines
.slice(1)
.join("\n")
.trim();


const card =
document.createElement(
"div"
);

card.className =
"info-section";


card.innerHTML = `

<div class="info-heading">

${escapeHTML(heading)}

</div>

${
body
?
`
<div class="info-text">

${makePhoneLinks(body)}

</div>
`
:
""
}

`;


container.appendChild(card);

});

}

/* ================================================= */
/* ================= ESCAPE ======================== */
/* ================================================= */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}
