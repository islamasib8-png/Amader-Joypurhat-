/* =====================================
   বাংলা সংখ্যা → ইংরেজি সংখ্যা
   ===================================== */

function banglaToEnglishNumber(text) {

  const banglaNumbers =
    "০১২৩৪৫৬৭৮৯";

  const englishNumbers =
    "0123456789";


  return text.replace(
    /[০-৯]/g,
    function(char) {

      return englishNumbers[
        banglaNumbers.indexOf(char)
      ];

    }
  );

}



/* =====================================
   PHONE NUMBER → NORMAL TEXT
   ===================================== */

/* =====================================
   IMAGE POST TIME
   ===================================== */

function formatPostTime(timestamp) {

  if (!timestamp) {

    return "";

  }


  try {

    let date;


    if (
      timestamp &&
      typeof timestamp.toDate === "function"
    ) {

      date =
        timestamp.toDate();

    }

    else if (
      timestamp.seconds
    ) {

      date =
        new Date(
          timestamp.seconds * 1000
        );

    }

    else {

      date =
        new Date(timestamp);

    }


    if (
      isNaN(date.getTime())
    ) {

      return "";

    }


    return date.toLocaleString(
      "bn-BD",
      {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }
    );

  }

  catch (error) {

    return "";

  }

}



/* =====================================
   LOAD IMAGE POSTS
   ===================================== */

async function loadImagePosts() {


  const imagePosts =
    document.getElementById(
      "imagePosts"
    );


  imagePosts.innerHTML =
    "";


  if (!categoryId) {

    return;

  }


  try {


    const postsSnapshot =
      await getDocs(
        collection(
          db,
          "posts"
        )
      );


    const posts = [];


    postsSnapshot.forEach(
      (doc) => {


        const data =
          doc.data();


        if (
          String(
            data.categoryId || ""
          ).trim()
          ===
          String(categoryId).trim()
        ) {


          posts.push({

            id: doc.id,

            ...data

          });

        }

      }
    );


    /* নতুন পোস্ট আগে */

    posts.sort(
      (a, b) => {


        let dateA = 0;
        let dateB = 0;


        if (
          a.createdAt &&
          typeof a.createdAt.toMillis === "function"
        ) {

          dateA =
            a.createdAt.toMillis();

        }


        if (
          b.createdAt &&
          typeof b.createdAt.toMillis === "function"
        ) {

          dateB =
            b.createdAt.toMillis();

        }


        return dateB - dateA;

      }
    );


    if (posts.length === 0) {

      return;

    }


    imagePosts.innerHTML = `

      <div class="posts-section-title">

        🖼️ Image Posts

      </div>

    `;


    posts.forEach(
      (post) => {


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "post-card";


        let images =
          post.images || [];


        /*
          যদি images Array না হয়,
          তাহলে একটি ছবি হিসেবে ধরবে।
        */

        if (
          !Array.isArray(images)
        ) {

          images =
            [images];

        }


        const validImages =
          images.filter(
            (url) =>
              typeof url === "string" &&
              url.trim() !== ""
          );


        let imagesHTML =
          "";


        validImages.forEach(
          (url) => {


            imagesHTML += `

              <img
                src="${url}"
                alt="আমাদের জয়পুরহাট"
                loading="lazy"
                onerror="this.style.display='none';">

            `;

          }
        );


        const caption =
          post.caption || "";


        const postTime =
          formatPostTime(
            post.createdAt
          );


        card.innerHTML = `

          ${
            imagesHTML
            ?
            `
            <div class="post-images">

              ${imagesHTML}

            </div>
            `
            :
            ""
          }


          ${
            caption
            ?
            `
            <div class="post-caption">

              ${caption}

            </div>
            `
            :
            ""
          }


          ${
            postTime
            ?
            `
            <div class="post-time">

              🕐 ${postTime}

            </div>
            `
            :
            ""
          }

        `;


        imagePosts.appendChild(
          card
        );

      }
    );


  }

  catch (error) {

    console.error(
      "Image Posts Error:",
      error
    );

  }

}



/* =====================================

async function loadData() {


  const categoryBox =
    document.getElementById(
      "categoryBox"
    );


  const upazilaList =
    document.getElementById(
      "upazilaList"
    );


  const contents =

  if (!categoryId) {

    categoryBox.innerHTML =
      "<div class='error'>Topic পাওয়া যায়নি।</div>";

    return;

  }


  try {


    const categorySnapshot =
      await getDocs(
        collection(
          db,
          "categories"
        )
      );


    let categoryData =
      null;


    categorySnapshot.forEach(
      (doc) => {


        if (
          doc.id === categoryId
        ) {

          categoryData =
            doc.data();

        }

      }
    );


    if (!categoryData) {

      categoryBox.innerHTML =
        "<div class='error'>Topic পাওয়া যায়নি।</div>";

      return;

    }


    categoryBox.innerHTML = `

      <div class="title">

        <div class="icon">

          ${categoryData.icon || "📌"}

        </div>


        <h2>

          ${categoryData.name || ""}

        </h2>


        <p>

          ${categoryData.description || ""}

    const contentSnapshot =
      await getDocs(
        collection(

    else {

        contents,
        allContents

    }


    /*
      Image Posts-ও লোড হবে

    await loadImagePosts();

  catch (error) {

    categoryBox.innerHTML = `

      <div class="error">

        তথ্য লোড করা যাচ্ছে না।

      </div>

    `;

  }

}

  allContents

    allContents.filter(

          ).trim()
        );

      }
    );


  if (matched.length === 0) {

      allContents.filter(

          const title =
            String(
              item.title || ""
            ).trim();


          return title.includes(
            upazila.name
          );

        }
      );

  if (matched.length === 0) {


    contents.innerHTML = `

      <div class="info-section">

        <div class="info-heading">

          🏘️ ${upazila.name}

        🏘️

      </div>


      <h2>

        ${upazila.name}

      </h2>

    </div>

  `;

    (item) => {


      createSections(
        contents,

  );


  window.scrollTo({

    behavior:

  });

/* =====================================
   CREATE SECTIONS
   ===================================== */

function createSections(
  container,
  text
) {


  const sections =
    text
      .replace(
        /\r\n/g,
        "\n"
      )
      .split(
        /\n\s*\n/
      )
      .map(
        section =>
          section.trim()
      )
      .filter(
        section =>
          section.length > 0
      );


  sections.forEach(
    (section) => {


      const lines =
        section.split(
          "\n"
        );


      const heading =
        lines[0].trim();


      const body =
        lines
          .slice(1)
          .join("\n")
          .trim();


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "info-section";


      const linkedBody =
        makePhoneLinks(
          body
        );


      card.innerHTML = `

        <div class="info-heading">

          ${heading}

        </div>


        ${
          body
          ?
          `<div class="info-text">${linkedBody}</div>`
          :
          ""
        }

      `;


      container.appendChild(
        card
      );

    }
  );

}



/* =====================================

      </div>

    `;


    return;

  }


  matched.forEach(
    (item) => {


      createSections(
        contents,
        item.content || ""
      );

    }
  );

}
