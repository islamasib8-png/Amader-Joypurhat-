  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;

    header {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;

    }

    header h1 {
      font-size: 23px;
    }

    .container {
      padding: 18px 15px 35px;
      max-width: 800px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #0f766e;
      font-weight: bold;
      text-decoration: none;
    }

    .title,
    .card,
    .content-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .title .icon,
    .card .icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .title h2 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .title p,
    .card p,
    .content-card p {
      line-height: 1.8;
      color: #444;
      font-size: 16px;
    }

    /* Firebase-এর লেখা যেভাবে থাকবে,
       সেভাবেই paragraph/line break দেখাবে */
    .content-card p {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card {
      cursor: pointer;
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card h3 {
      color: #0f766e;
      font-size: 19px;
      margin-bottom: 6px;
    }

    .content-card h3 {
      color: #0f766e;
      margin-bottom: 10px;
      font-size: 19px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .error {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      color: #b91c1c;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0 12px;
    }

    footer {
      margin-top: 30px;

    footer a {

    .whatsapp {
      background: #25D366;
    }

    .facebook {
      background: #1877F2;
    }
  </style>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAG05o2MjHH3UL8Gp7VNmrQGeqq-4YrDEk",
      authDomain: "amader-joypurhat-7b3fb.firebaseapp.com",
      projectId: "amader-joypurhat-7b3fb",
      storageBucket: "amader-joypurhat-7b3fb.firebasestorage.app",
      messagingSenderId: "542366008798",
      appId: "1:542366008798:web:4f9a7c210b561406a5494f"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    const params =
      new URLSearchParams(window.location.search);

    const categoryId =
      params.get("id");


    async function loadData() {

      const categoryBox =
        document.getElementById("categoryBox");

      const upazilaList =
        document.getElementById("upazilaList");

      const contents =
        document.getElementById("contents");


      if (!categoryId) {

        categoryBox.innerHTML =
          "<div class='error'>Topic পাওয়া যায়নি।</div>";

        return;
      }


      try {

        /* =========================
           CATEGORY LOAD
        ========================= */

        const categorySnapshot =
          await getDocs(
            collection(db, "categories")
          );


        let categoryData = null;


        categorySnapshot.forEach((doc) => {

          if (doc.id === categoryId) {

            categoryData = doc.data();

          }

        });


        if (!categoryData) {

          categoryBox.innerHTML =
            "<div class='error'>Topic পাওয়া যায়নি।</div>";

          return;
        }


        categoryBox.innerHTML = `

          <div class="title">

            <div class="icon">
              ${categoryData.icon || "📌"}
            </div>

            <h2>
              ${categoryData.name || ""}
            </h2>

            <p>
              ${categoryData.description || ""}
            </p>

          </div>

        `;


        /* =========================
           CONTENT LOAD
        ========================= */

        const contentSnapshot =
          await getDocs(
            collection(db, "contents")
          );


        const allContents = [];


        contentSnapshot.forEach((doc) => {

          const data = doc.data();


          if (data.categoryId === categoryId) {

            allContents.push({
              id: doc.id,
              ...data
            });

          }

        });


        /* =========================
           UPAZILA CATEGORY
        ========================= */

        const isUpazila =
          categoryData.name &&
          categoryData.name.includes("উপজেলার");


        if (isUpazila) {

          upazilaList.innerHTML = `

            <div class="section-title">
              🏘️ উপজেলা সমূহ
            </div>

          `;


          const upazilas = [

            "জয়পুরহাট সদর উপজেলা",

            "পাঁচবিবি উপজেলা",

            "আক্কেলপুর উপজেলা",

            "কালাই উপজেলা",

            "ক্ষেতলাল উপজেলা"

          ];


          upazilas.forEach((name) => {

            const card =
              document.createElement("div");


            card.className = "card";


            card.innerHTML = `

              <div class="icon">
                🏘️
              </div>

              <h3>
                ${name}
              </h3>

              <p>
                বিস্তারিত তথ্য দেখতে চাপ দিন
              </p>

            `;


            card.onclick = () => {

              showUpazila(
                name,
                allContents
              );

            };


            upazilaList.appendChild(card);

          });


          contents.innerHTML = `

            <div class="loading">

              উপরের তালিকা থেকে
              একটি উপজেলা নির্বাচন করুন।

            </div>

          `;


        } else {

          /* অন্য Category হলে
             সব Content একসাথে দেখাবে */

          showAllContents(allContents);

        }


      } catch (error) {

        console.error(error);


        categoryBox.innerHTML = `

          <div class="error">

            তথ্য লোড করা যাচ্ছে না।

          </div>

        `;

      }

    }


    /* =========================
       SHOW UPAZILA
       ========================= */

    function showUpazila(
      name,
      allContents
    ) {

      const contents =
        document.getElementById("contents");


      /*
       Title-এর মধ্যে উপজেলা নাম আছে
       কিনা সেটা পরীক্ষা করবে
      */

      const matched =
        allContents.filter((item) => {

          if (!item.title) {
            return false;
          }

          return item.title.trim()
            .includes(name);

        });


      if (matched.length === 0) {

        contents.innerHTML = `

          <div class="content-card">

            <h3>
              ${name}
            </h3>

            <p
