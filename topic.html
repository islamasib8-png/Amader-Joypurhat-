@media(min-width:600px){.subcategory-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){header{padding:19px 12px}header h1{font-size:19px}.container{padding:17px 12px 28px}.back{left:12px;top:-52px}.subcategory-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.subcategory-card{min-height:103px;padding:13px 7px}.submission-image{max-height:270px}}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAG05o2MjHH3UL8GpAvQQGeqq-4YrDEk",authDomain:"amader-joypurhat-7b3fb.firebaseapp.com",projectId:"amader-joypurhat-7b3fb",storageBucket:"amader-joypurhat-7b3fb.firebasestorage.app",messagingSenderId:"542366008798",appId:"1:542366008798:web:4f9a7c210b561406a5494f"};

function applyDarkMode(){document.body.classList.toggle("dark-mode",localStorage.getItem("amaderJoypurhatDarkMode")==="on")}

const params=new URLSearchParams(location.search),categoryId=params.get("id");
let selectedSubCategory="",selectedSubCategoryName="",hasContent=false,hasApprovedSubmission=false,hasBloodDonor=false,hasImagePost=false;
const specialSubCategories={
"কোচিং ও প্রাইভেট সেন্টার":[{id:"university",name:"বিশ্ববিদ্যালয় কোচিং",icon:"🎓"},{id:"medical",name:"মেডিকেল কোচিং",icon:"🩺"},{id:"nursing",name:"নার্সিং কোচিং",icon:"👩‍⚕️"},{id:"class6-12",name:"৬ষ্ঠ-১২ কোচিং",icon:"📚"}],
"ডাক্তার":[{id:"cardiology",name:"হৃদরোগ বিশেষজ্ঞ",icon:"❤️"},{id:"child",name:"শিশু বিশেষজ্ঞ",icon:"👶"},{id:"medicine",name:"মেডিসিন বিশেষজ্ঞ",icon:"💊"},{id:"surgery",name:"সার্জন",icon:"🔬"},{id:"gynecology",name:"স্ত্রীরোগ ও প্রসূতি বিশেষজ্ঞ",icon:"👩"},{id:"orthopedic",name:"অর্থোপেডিক বিশেষজ্ঞ",icon:"🦴"},{id:"ent",name:"নাক-কান-গলা বিশেষজ্ঞ",icon:"👂"},{id:"eye",name:"চক্ষু বিশেষজ্ঞ",icon:"👁️"},{id:"skin",name:"চর্মরোগ বিশেষজ্ঞ",icon:"🩺"},{id:"dental",name:"দন্ত বিশেষজ্ঞ",icon:"🦷"},{id:"other-doctor",name:"অন্যান্য বিশেষজ্ঞ",icon:"👨‍⚕️"}],
"ইসলামিক কর্নার":[{id:"quran",name:"কুরআন",icon:"📖",externalLink:"https://quran.com/bn/surahs"},{id:"hadith",name:"হাদিস",icon:"📚",externalLink:"https://ihadis.com/"},{id:"kalema",name:"কলেমা",icon:"☪️"},{id:"namaz",name:"নামাজ",icon:"🕌"},{id:"roza",name:"রোজা",icon:"🌙"},{id:"hajj",name:"হজ্ব",icon:"🕋"},{id:"zakat",name:"যাকাত",icon:"🤲"},{id:"islamic-post",name:"ইসলামিক পোস্ট",icon:"☪️"}]
};
const upazilas=[{name:"জয়পুরহাট সদর উপজেলা",ids:["joypurhat-sadar","joypurhat_sadar","joypurhat-sadar-upazila"]},{name:"পাঁচবিবি উপজেলা",ids:["panchbibi","panchbibi-upazila","panchbibi_upazila"]},{name:"আক্কেলপুর উপজেলা",ids:["akkelpur","akkelpur-upazila","akkelpur_upazila"]},{name:"কালাই উপজেলা",ids:["kalai","kalai-upazila","kalai_upazila"]},{name:"ক্ষেতলাল উপজেলা",ids:["khetlal","khetlal-upazila","khetlal_upazila"]}];
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function escapeAttribute(v){return escapeHTML(v)}
function makePhoneLinks(text){return escapeHTML(text||"").replace(/(https?:\/\/[^\s<]+)/g,url=>{let clean=url,ending="";while(clean.length&&/[.,!?;:)\]}]$/.test(clean)){ending=clean.slice(-1)+ending;clean=clean.slice(0,-1)}return `<a href="${escapeAttribute(clean)}" target="_blank" rel="noopener noreferrer">${clean}</a>${ending}`})}
function formatPostTime(timestamp){if(!timestamp)return "";try{let date;if(typeof timestamp.toDate==="function")date=timestamp.toDate();else if(timestamp.seconds)date=new Date(timestamp.seconds*1000);else date=new Date(timestamp);if(isNaN(date.getTime()))return "";return date.toLocaleString("bn-BD",{year:"numeric",month:"long",day:"numeric",hour:"numeric",minute:"2-digit"})}catch{return ""}}
function resetEmptyState(){hasContent=hasApprovedSubmission=hasBloodDonor=hasImagePost=false;document.getElementById("emptyMessage").innerHTML=""}
function updateEmptyState(){const box=document.getElementById("emptyMessage");box.innerHTML=(hasContent||hasApprovedSubmission||hasBloodDonor||hasImagePost)?"":'<div class="empty-message">এই Topic-এর তথ্য এখনো যোগ করা হয়নি।</div>'}
async function loadBloodDonors(){const box=document.getElementById("bloodDonors");box.innerHTML="";if(!categoryId)return 0;try{const snap=await getDocs(collection(db,"submissions")),donors=[];snap.forEach(d=>{const x=d.data(),hasId=String(x.categoryId||"").trim()!=="",same=String(x.categoryId||"").trim()===String(categoryId||"").trim();if(x.type==="blood"&&x.status==="approved"&&(!hasId||same))donors.push({id:d.id,...x})});donors.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));if(!donors.length)return 0;hasBloodDonor=true;box.innerHTML='<div class="blood-section-title">🩸 রক্তদাতা তালিকা</div>';donors.forEach(d=>{const c=document.createElement("div");c.className="blood-card";c.innerHTML=`<div class="blood-group">🩸 ${escapeHTML(d.bloodGroup||"")}</div><div class="blood-name">${escapeHTML(d.name||"")}</div><div class="blood-info">📍 <b>ঠিকানা:</b> ${escapeHTML(d.address||"")}</div><div class="blood-mobile">📱 <b>মোবাইল:</b> ${escapeHTML(d.mobile||"")}</div>`;box.appendChild(c)});return donors.length}catch(e){console.error("Blood Donor Error:",e);box.innerHTML="";return 0}}
async function loadApprovedSubmissions(){const box=document.getElementById("approvedSubmissions");box.innerHTML="";if(!categoryId)return 0;try{const snap=await getDocs(collection(db,"submissions")),items=[];snap.forEach(d=>{const x=d.data(),same=String(x.categoryId||"").trim()===String(categoryId||"").trim();if(x.status!=="approved"||!same||x.type==="blood")return;if(selectedSubCategory&&String(x.subCategory||"").trim()!==selectedSubCategory)return;items.push({id:d.id,...x})});items.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));if(!items.length){hasApprovedSubmission=false;updateEmptyState();return 0}hasApprovedSubmission=true;box.innerHTML=`<div class="submission-section-title">📋 ${escapeHTML(selectedSubCategoryName||"অনুমোদিত তথ্য")}</div>`;items.forEach(item=>{const c=document.createElement("div");c.className="submission-card";const title=item.title||item.name||item.businessName||item.institutionName||item.restaurantName||item.serviceName||item.route||"তথ্য",details=item.details||item.description||item.content||item.info||item.bio||item.schedule||"";let h="";if(item.imageUrl)h+=`<div class="submission-image-box"><img class="submission-image" src="${escapeAttribute(item.imageUrl)}" alt="${escapeAttribute(title)}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`;h+=`<div class="submission-title">${escapeHTML(title)}</div>`;const fields=[["subCategoryName","📂 বিভাগ"],["name","👤 নাম"],["degree","🎓 ডিগ্রি/যোগ্যতা"],["identity","📌 পরিচয়"],["specialty","🩺 বিশেষত্ব"],["chamber","🏢 চেম্বারের নাম/স্থান"],["counter","📍 কাউন্টার"],["address","📍 ঠিকানা"],["mobile","📱 মোবাইল"],["phone","☎️ ফোন"],["email","✉️ ই-মেইল"],["bloodGroup","🩸 রক্তের গ্রুপ"],["upazila","🏘️ উপজেলা"],["route","🚌 রুট"],["serviceName","🛠️ সেবার নাম"],["available24h","⏰ ২৪ ঘণ্টা সেবা"]];fields.forEach(([key,label])=>{if(item[key]&&(key!=="name"||item.name!==title)&&(key!=="phone"||item.phone!==item.mobile))h+=`<div class="submission-row">${label.includes(" ")?`<b>${label}:</b>`:`<b>${label}:</b>`} ${escapeHTML(item[key])}</div>`});if(item.serialInfo)h+=`<div class="submission-row">📋 <b>তথ্য সিরিয়ালের জন্য মোবাইল নম্বর:</b> ${makePhoneLinks(item.serialInfo)}</div>`;if(item.source)h+=`<div class="submission-row">🔗 <b>তথ্যসূত্র:</b> ${makePhoneLinks(item.source)}</div>`;if(details)h+=`<div class="submission-details">${makePhoneLinks(details)}</div>`;const time=formatPostTime(item.createdAt);if(time)h+=`<div class="post-time" style="padding:12px 0 0">🕐 ${time}</div>`;c.innerHTML=h;box.appendChild(c)});return items.length}catch(e){console.error("Approved Submission Error:",e);box.innerHTML="";return 0}}
function showSubcategorySelector(name){const box=document.getElementById("subcategoryBox"),list=specialSubCategories[name];if(!Array.isArray(list)){box.innerHTML="";return}box.innerHTML='<div class="subcategory-title">📂 বিভাগ নির্বাচন করুন</div><div class="subcategory-grid" id="subcategoryGrid"></div>';const grid=document.getElementById("subcategoryGrid");list.forEach(item=>{const c=document.createElement("div");c.className="subcategory-card";c.innerHTML=`<div class="subcategory-icon">${escapeHTML(item.icon)}</div><div class="subcategory-name">${escapeHTML(item.name)}</div>`;c.addEventListener("click",async()=>{if(item.externalLink){window.open(item.externalLink,"_blank","noopener");return}selectedSubCategory=item.id;selectedSubCategoryName=item.name;grid.querySelectorAll(".subcategory-card").forEach(x=>x.classList.remove("active"));c.classList.add("active");document.getElementById("emptyMessage").innerHTML="";await Promise.all([loadApprovedSubmissions(),loadImagePosts()]);updateEmptyState();document.getElementById("approvedSubmissions").scrollIntoView({behavior:"smooth",block:"start"})});grid.appendChild(c)})}
async function loadImagePosts(){const box=document.getElementById("imagePosts");box.innerHTML="";if(!categoryId)return 0;try{const snap=await getDocs(collection(db,"posts")),posts=[];snap.forEach(d=>{const x=d.data();if(String(x.categoryId||"").trim()!==String(categoryId||"").trim())return;if(selectedSubCategory&&String(x.subCategory||"").trim()!==selectedSubCategory)return;posts.push({id:d.id,...x})});posts.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));if(!posts.length){hasImagePost=false;updateEmptyState();return 0}hasImagePost=true;box.innerHTML='<div class="posts-section-title">🖼️ ছবি পোস্ট</div>';posts.forEach(p=>{const c=document.createElement("div");c.className="post-card";let imgs=Array.isArray(p.images)?p.images:[p.images].filter(Boolean);const valid=imgs.filter(u=>typeof u==="string"&&u.trim());const time=formatPostTime(p.createdAt);c.innerHTML=`${valid.length?`<div class="post-images">${valid.map(u=>`<img src="${escapeAttribute(u)}" alt="আমাদের জয়পুরহাট" loading="lazy" onerror="this.style.display='none'">`).join("")}</div>`:""}${p.caption?`<div class="post-caption">${makePhoneLinks(p.caption)}</div>`:""}${time?`<div class="post-time">🕐 ${time}</div>`:""}`;box.appendChild(c)});return posts.length}catch(e){console.error("Image Posts Error:",e);return 0}}
function showUpazilaList(box,contents,all){box.innerHTML='<div class="section-title">🏘️ উপজেলা সমূহ</div>';upazilas.forEach(u=>{const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="icon">🏘️</div><div><h3>${escapeHTML(u.name)}</h3><p>বিস্তারিত তথ্য দেখতে চাপ দিন</p></div>`;c.onclick=()=>showUpazila(u,all);box.appendChild(c)});contents.innerHTML='<div class="loading">উপরের তালিকা থেকে একটি উপজেলা নির্বাচন করুন।</div>'}
function showUpazila(u,all){const box=document.getElementById("contents");let matched=all.filter(x=>u.ids.includes(String(x.categoryId||"").trim()));if(!matched.length)matched=all.filter(x=>String(x.title||"").includes(u.name));if(!matched.length){box.innerHTML=`<div class="info-section"><div class="info-heading">🏘️ ${escapeHTML(u.name)}</div><div class="info-text">এই উপজেলার তথ্য এখনো যোগ করা হয়নি।</div></div>`;return}hasContent=true;updateEmptyState();box.innerHTML=`<div class="title"><div class="icon">🏘️</div><h2>${escapeHTML(u.name)}</h2></div>`;matched.forEach(x=>createSections(box,x.content||""));window.scrollTo({top:box.offsetTop-15,behavior:"smooth"})}
function createSections(container,text){text.replace(/\r\n/g,"\n").split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).forEach(s=>{const lines=s.split("\n"),heading=lines[0].trim(),body=lines.slice(1).join("\n").trim(),c=document.createElement("div");c.className="info-section";c.innerHTML=`<div class="info-heading">${escapeHTML(heading)}</div>${body?`<div class="info-text">${makePhoneLinks(body)}</div>`:""}`;container.appendChild(c)})}
function showAllContents(box,all){box.innerHTML="";const matched=all.filter(x=>String(x.categoryId||"").trim()===String(categoryId||"").trim());if(!matched.length)return;hasContent=true;matched.forEach(x=>createSections(box,x.content||""))}
async function loadData(){const categoryBox=document.getElementById("categoryBox"),subBox=document.getElementById("subcategoryBox"),upazilaBox=document.getElementById("upazilaList"),contents=document.getElementById("contents");resetEmptyState();if(!categoryId){categoryBox.innerHTML='<div class="error">Topic পাওয়া যায়নি।</div>';return}try{const catSnap=await getDocs(collection(db,"categories"));let cat=null;catSnap.forEach(d=>{if(d.id===categoryId)cat=d.data()});if(!cat){categoryBox.innerHTML='<div class="error">Topic পাওয়া যায়নি।</div>';return}const name=String(cat.name||"").trim();categoryBox.innerHTML=`<div class="title"><div class="icon">${escapeHTML(cat.icon||"📌")}</div><h2>${escapeHTML(cat.name||"")}</h2><p>${escapeHTML(cat.description||"")}</p></div>`;showSubcategorySelector(name);const special=Array.isArray(specialSubCategories[name]);if(name==="রক্তদাতা")await loadBloodDonors();const contentSnap=await getDocs(collection(db,"contents")),all=[];contentSnap.forEach(d=>all.push({id:d.id,...d.data()}));if(name.includes("উপজেলা"))showUpazilaList(upazilaBox,contents,all);else showAllContents(contents,all);if(!special){await Promise.all([loadApprovedSubmissions(),loadImagePosts()])}else{document.getElementById("approvedSubmissions").innerHTML="";document.getElementById("imagePosts").innerHTML="";document.getElementById("emptyMessage").innerHTML='<div class="empty-message">উপরের বিভাগ থেকে একটি নির্বাচন করুন।</div>'}if(!special)updateEmptyState()}catch(e){console.error(e);categoryBox.innerHTML='<div class="error">তথ্য লোড করা যাচ্ছে না। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।</div>'}}
loadData();
</script>
</body>
</html>
