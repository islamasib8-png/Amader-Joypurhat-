/* =========================
   বাংলা সংখ্যা → ইংরেজি
   ========================= */

function banglaToEnglish(text) {

  const bn =
    "০১২৩৪৫৬৭৮৯";

  const en =
    "0123456789";

  return text.replace(
    /[০-৯]/g,
    function(char) {

      return en[
        bn.indexOf(char)
      ];

    }
  );

}


/* =========================
   PHONE NUMBER CLEAN
   ========================= */

function makeTelNumber(number) {

  let n =
    banglaToEnglish(number);

  n =
    n.replace(
      /[\s\-()]/g,
      ""
    );

  if (
    n.startsWith("+880")
  ) {

    return n;

  }

  if (
    n.startsWith("880")
  ) {

    return "+" + n;

  }

  if (
    n.startsWith("0")
  ) {

    return "+880" + n.substring(1);

  }

  return n;

}


/* =========================
   TEXT → HTML
   ========================= */

function formatText(text) {

  if (!text) {
    return "";
  }


  let converted =
    banglaToEnglish(
      String(text)
    );


  /*
   লাইন আলাদা রাখা হবে
  */

  const lines =
    converted
      .split("\n")
      .map(
        line => line.trim()
      )
      .filter(
        line => line.length > 0
      );


  let html = "";


  lines.forEach(
    line => {


      /*
       ফোন নম্বর খোঁজা
      */

      const phoneRegex =
        /(\+?880[\s-]?[0-9]{10,11}|0[0-9]{9,10}(?:[\s-]?[0-9]{2,5})?)/g;


      let lastIndex = 0;

      let match;


      phoneRegex.lastIndex = 0;


      while (
        (match =
          phoneRegex.exec(line)) !== null
      ) {


        const before =
          line.substring(
            lastIndex,
            match.index
          );


        html +=
          escapeHTML(before);


        const phone =
          match[0];


        const tel =
          makeTelNumber(phone);


        html += `

          <span class="phone-row">

            <span class="phone-number">
              ${escapeHTML(phone)}
            </span>

            <a
              class="call-button"
              href="tel:${tel}">

              📞 Call

            </a>

          </span>

        `;


        lastIndex =
          match.index +
          phone.length;

      }


      html +=
        escapeHTML(
          line.substring(lastIndex)
        );


      html += "<br>";

    }
  );


  return html;

}


/* =========================
   HTML SAFE
   ========================= */

function escapeHTML(text) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   DATA LOAD
   ========================= */

async function loadData() {


  const categoryBox =
    document.getElementById(
      "categoryBox"
    );


  const upazilaList =
    document.getElementById(
      "upazilaList"
    );


  const contents =
    document.getElementById(
      "contents"
    );


  if (!categoryId) {

    categoryBox.innerHTML =
      "<div class='error'>Topic পাওয়া যায়নি।</div>";

    return;

  }


  try {


    /* =========================
       CATEGORY
       ========================= */

    const categorySnapshot =
      await getDocs(
        collection(
          db,
          "categories"
        )
      );


    let categoryData =
      null;


    categorySnapshot.forEach(
      (doc) => {

        if (
          doc.id === categoryId
        ) {

          categoryData =
            doc.data();

        }

      }
    );


    if (!categoryData) {

      categoryBox.innerHTML =
        "<div class='error'>Topic পাওয়া যায়নি।</div>";

      return;

    }


    categoryBox.innerHTML = `

      <div class="title">

        <div class="icon">
          ${categoryData.icon || "📌"}
        </div>

        <h2>
          ${categoryData.name || ""}
        </h2>

        <p>
          ${categoryData.description || ""}
        </p>

      </div>

    `;


    /* =========================
       CONTENTS
       ========================= */

    const contentSnapshot =
      await getDocs(
        collection(
          db,
          "contents"
        )
      );


    const allContents = [];


    contentSnapshot.forEach(
      (doc) => {

        const data =
          doc.data();


        allContents.push({

          id: doc.id,

          ...data

        });

      }
    );


    /* =========================
       UPAZILA
       ========================= */

    const isUpazila =
      categoryData.name &&
      (
        categoryData.name.includes(
          "উপজেলা"
        ) ||
        categoryData.name.includes(
          "উপজেলার"
        )
      );


    if (isUpazila) {

      showUpazilaList(
        upazilaList,
        contents,
        allContents
      );

    } else {

      showAllContents(
        contents,
        allContents
      );

    }


  }

  catch (error) {

    console.error(error);


    categoryBox.innerHTML = `

      <div class="error">

        তথ্য লোড করা যাচ্ছে না।

      </div>

    `;

  }

}


/* =========================
   UPAZILA LIST
   ========================= */

function showUpazilaList(

  contents,
  allContents
) {


  upazilaList.innerHTML = `

    </div>

      card.className =

        <p>
          বিস্তারিত তথ্য দেখতে চাপ দিন
        </p>

      `;


      card.onclick = () => {

      };


      upazilaList.appendChild(

    }

  contents.innerHTML = `

      উপরের তালিকা থেকে একটি উপজেলা নির্বাচন করুন।

    </div>

  `;

}


/* =========================
   SHOW UPAZILA
   ========================= */

function showUpazila(
  upazila,
  allContents
) {


  const contents =
    document.getElementById(
      "contents"
    );


  let matched =
    allContents.filter(
      (item) => {

        return upazila.ids.includes(
          String(
            item.categoryId || ""
          ).trim()
        );

      }
    );


  if (matched.length === 0) {

    matched =
      allContents.filter(
        (item) => {

          const title =
            String(
              item.title || ""
            ).trim();


          return title.includes(
            upazila.name
          );

        }
      );

  }


  if (matched.length === 0) {

    contents.innerHTML = `

      <div class="info-section">

        <div class="info-heading">

          🏘️ ${upazila.name}

        </div>

        <div class="info-text">

          এই উপজেলার তথ্য এখনো যোগ করা হয়নি।

        </div>

      </div>

    `;

    return;

  }


  /*
   উপজেলা নাম
  */

  contents.innerHTML = `

    <div class="title">

      <div class="icon">
        🏘️
      </div>

      <h2>
        ${upazila.name}
      </h2>

    </div>

  `;


  /*
   প্রতিটি Firebase document
   = আলাদা কার্ড
  */

  matched.forEach(
    (item) => {

      createCardsFromContent(
        contents,
        item.content || ""
      );

    }
  );


  window.scrollTo({

    top:
      contents.offsetTop - 15,

    behavior:
      "smooth"

  });

}


/* =========================
   CREATE SEPARATE CARDS
   ========================= */

function createCardsFromContent(
  container,
  text
) {


  if (!text) {
    return;
  }


  /*
   দুইটি খালি লাইনের মাধ্যমে
   আলাদা তথ্য শনাক্ত করা হবে
  */

  const sections =
    String(text)
      .replace(
        /\r\n/g,
        "\n"
      )
      .split(
        /\n\s*\n/
      )
      .map(
        section =>
          section.trim()
      )
      .filter(
        section =>
          section.length > 0
      );


  sections.forEach(
    (section) => {


      const lines =
        section
          .split("\n")
          .map(
            line =>
              line.trim()
          )
          .filter(
            line =>
              line.length > 0
          );


      if (
        lines.length === 0
      ) {

        return;

      }


      /*
       প্রথম লাইন = Heading
      */

      const heading =
        lines[0];


      /*
       বাকি লাইন = Body
      */

      const body =
        lines
          .slice(1)
          .join("\n");


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "info-section";


      const formattedBody =
        formatText(body);


      card.innerHTML = `

        <div class="info-heading">

          ${escapeHTML(heading)}

        </div>

        ${
          body
          ?
          `<div class="info-text">${formattedBody}</div>`
          :
          ""
        }

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* =========================
   OTHER CATEGORY
   ========================= */

function showAllContents(
  contents,
  allContents
) {


  contents.innerHTML =
    "";


  const matched =
    allContents.filter(
      (item) => {

        return item.categoryId ===
          categoryId;

      }
    );


  if (
    matched.length === 0
  ) {

    contents.innerHTML = `

      <div class="loading">

        এই Topic-এর তথ্য এখনো যোগ করা হয়নি।

      </div>

    `;

    return;

  }


  /*
   অন্য Topic-এর ক্ষেত্রেও
   প্রতিটি তথ্য আলাদা কার্ড
  */

  matched.forEach(
    (item) => {

      createCardsFromContent(
        contents,
        item.content || ""
      );

    }
  );

}


loadData();
