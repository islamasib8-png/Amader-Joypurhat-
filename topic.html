/* =====================================
   বাংলা সংখ্যা → ইংরেজি সংখ্যা
   ===================================== */

function banglaToEnglishNumber(text) {

  const banglaNumbers =
    "০১২৩৪৫৬৭৮৯";

  const englishNumbers =
    "0123456789";


  return text.replace(
    /[০-৯]/g,
    function(char) {

      return englishNumbers[
        banglaNumbers.indexOf(char)
      ];

    }
  );

}


/* =====================================
   PHONE NUMBER → CALL LINK
   ===================================== */

function makePhoneLinks(text) {


  let converted =
    banglaToEnglishNumber(text);


  /*
   বাংলাদেশি ফোন নম্বর চিনবে।

   যেমন:
   01319058313
   013-19058313
   ০১৩-১৯০৫৮৩১৩
   02589915574
   +8801319058313
  */


  const phoneRegex =
    /(\+?880[\s-]?[1-9][0-9]{9}|0[1-9][0-9]{8,9}(?:[\s-]*[0-9]{1,5})?)/g;


  converted =
    converted.replace(
      phoneRegex,
      function(match) {


        let number =
          match.replace(
            /[\s-]/g,
            ""
          );


        let telNumber =
          number;


        /*
         013XXXXXXXX
         →
         +88013XXXXXXXX
        */


        if (
          telNumber.startsWith("0")
        ) {

          telNumber =
            "+880" +
            telNumber.substring(1);

        }


        return `

          <a
            class="phone-link"
            href="tel:${telNumber}">

            📞 ${match}

          </a>

        `;

      }
    );


  return converted;

}


/* =====================================
   DATA LOAD
   ===================================== */

async function loadData() {


  const categoryBox =
    document.getElementById(
      "categoryBox"
    );


  const upazilaList =
    document.getElementById(
      "upazilaList"
    );


  const contents =
    document.getElementById(
      "contents"
    );


  if (!categoryId) {

    categoryBox.innerHTML =
      "<div class='error'>Topic পাওয়া যায়নি।</div>";

    return;

  }


  try {


    const categorySnapshot =
      await getDocs(
        collection(
          db,
          "categories"
        )
      );


    let categoryData =
      null;


    categorySnapshot.forEach(
      (doc) => {

        if (
          doc.id === categoryId
        ) {

          categoryData =
            doc.data();

        }

      }
    );


    if (!categoryData) {

      categoryBox.innerHTML =
        "<div class='error'>Topic পাওয়া যায়নি।</div>";

      return;

    }


    categoryBox.innerHTML = `

      <div class="title">

        <div class="icon">
          ${categoryData.icon || "📌"}
        </div>

        <h2>
          ${categoryData.name || ""}
        </h2>

        <p>
          ${categoryData.description || ""}
        </p>

      </div>

    `;


    const contentSnapshot =
      await getDocs(
        collection(
          db,
          "contents"
        )
      );


    const allContents = [];


    contentSnapshot.forEach(
      (doc) => {

        const data =
          doc.data();


        allContents.push({

          id: doc.id,

          ...data

        });

      }
    );


    const isUpazila =
      categoryData.name &&
      (
        categoryData.name.includes(
          "উপজেলা"
        ) ||
        categoryData.name.includes(
          "উপজেলার"
        )
      );


    if (isUpazila) {


      showUpazilaList(
        upazilaList,
        contents,
        allContents
      );


    } else {


      showAllContents(
        contents,
        allContents
      );

    }


  }

  catch (error) {


    console.error(error);


    categoryBox.innerHTML = `

      <div class="error">

        তথ্য লোড করা যাচ্ছে না।

      </div>

    `;

  }

}

        </p>

      `;


      card.onclick = () => {

        showUpazila(
          upazila,
          allContents
        );

      };


      upazilaList.appendChild(
        card
      );

    }
  );


  contents.innerHTML = `

    <div class="loading">

      উপরের তালিকা থেকে একটি উপজেলা নির্বাচন করুন।

    </div>

  `;

}


/* =====================================
   SHOW UPAZILA
   ===================================== */

function showUpazila(
  upazila,
  allContents
) {


  const contents =
    document.getElementById(
      "contents"
    );


  let matched =
    allContents.filter(
      (item) => {

        return upazila.ids.includes(
          String(
            item.categoryId || ""
          ).trim()
        );

      }
    );


  if (matched.length === 0) {


    matched =
      allContents.filter(
        (item) => {


          const title =
            String(
              item.title || ""
            ).trim();


          return title.includes(
            upazila.name
          );

        }
      );

  }


  if (matched.length === 0) {


    contents.innerHTML = `

      <div class="info-section">

        <div class="info-heading">

          🏘️ ${upazila.name}

        </div>

        <div class="info-text">

          এই উপজেলার তথ্য এখনো যোগ করা হয়নি।

        </div>

      </div>

    `;


    return;

  }


  contents.innerHTML = `

    <div class="title">

      <div class="icon">
        🏘️
      </div>

      <h2>
        ${upazila.name}
      </h2>

    </div>

  `;


  matched.forEach(
    (item) => {

      createSections(
        contents,
        item.content || ""
      );

    }
  );


  window.scrollTo({

    top:
      contents.offsetTop - 15,

    behavior:
      "smooth"

  });

}


/* =====================================
   CREATE SECTIONS
   ===================================== */

function createSections(
  container,
  text
) {


  const sections =
    text
      .replace(
        /\r\n/g,
        "\n"
      )
      .split(
        /\n\s*\n/
      )
      .map(
        section =>
          section.trim()
      )
      .filter(
        section =>
          section.length > 0
      );


  sections.forEach(
    (section) => {


      const lines =
        section.split(
          "\n"
        );


      const heading =
        lines[0].trim();


      const body =
        lines
          .slice(1)
          .join("\n")
          .trim();


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "info-section";


      /*
       ফোন নম্বরকে Call link বানানো
      */

      const linkedBody =
        makePhoneLinks(
          body
        );


      card.innerHTML = `

        <div class="info-heading">

          ${heading}

        </div>

        ${
          body
          ?
          `<div class="info-text">${linkedBody}</div>`
          :
          ""
        }

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* =====================================
   OTHER CATEGORY
   ===================================== */

function showAllContents(
  contents,
  allContents
) {


  contents.innerHTML =
    "";


  const matched =
    allContents.filter(
      (item) => {

        return item.categoryId ===
          categoryId;

      }
    );


  if (matched.length === 0) {


    contents.innerHTML = `

      <div class="loading">

        এই Topic-এর তথ্য এখনো যোগ করা হয়নি।

      </div>

    `;


    return;

  }


  matched.forEach(
    (item) => {

      createSections(
        contents,
        item.content || ""
      );

    }
  );

}
