<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>আমাদের জয়পুরহাট</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 23px;
    }

    .container {
      padding: 18px 15px 35px;
      max-width: 800px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #0f766e;
      font-weight: bold;
      text-decoration: none;
    }

    .title {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .title .icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .title h2 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .title p {
      line-height: 1.8;
      color: #444;
      font-size: 16px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card .icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .card h3 {
      color: #0f766e;
      font-size: 19px;
      margin-bottom: 6px;
    }

    .card p {
      color: #666;
      line-height: 1.7;
      font-size: 15px;
    }

    /* =========================
       INFORMATION SECTIONS
       ========================= */

    .info-section {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .info-heading {
      color: #0f766e;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .info-text {
      color: #444;
      font-size: 16px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .error {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      color: #b91c1c;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0 12px;
    }

    footer {
      margin-top: 30px;
      padding: 25px 15px;
      text-align: center;
      background: #f1f5f9;
      border-top: 1px solid #ddd;
      line-height: 1.7;
    }

    footer a {
      display: inline-block;
      margin: 5px;
      padding: 10px 16px;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .whatsapp {
      background: #25D366;
    }

    .facebook {
      background: #1877F2;
    }

  </style>
</head>

<body>

  <header>
    <h1>আমাদের জয়পুরহাট</h1>
  </header>


  <div class="container">

    <a href="index.html" class="back">
      ← ফিরে যান
    </a>

    <div id="categoryBox"></div>

    <div id="upazilaList"></div>

    <div id="contents"></div>

  </div>


  <footer>

    <div style="font-weight:bold; margin-bottom:10px;">
      © 2026 আমাদের জয়পুরহাট
    </div>

    <div style="font-size:14px; margin-bottom:12px;">
      উপরোক্ত তথ্যে কোনো ভুল বা সংশোধনের প্রয়োজন হলে
      অনুগ্রহ করে যোগাযোগ করুন। যাচাই সাপেক্ষে প্রয়োজনীয়
      সংশোধন করা হবে।
    </div>

    <div style="font-weight:bold;">
      Md. Asib Islam
    </div>

    <div style="font-size:14px;">
      Uchan, Dharanji, Panchbibi, Joypurhat
    </div>

    <div style="margin-top:15px;">

      <a
        class="whatsapp"
        href="https://wa.me/8801319058313"
        target="_blank">
        💬 WhatsApp
      </a>

      <a
        class="facebook"
        href="https://www.facebook.com/Asibislam01"
        target="_blank">
        📘 Facebook
      </a>

    </div>

  </footer>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyAG05o2MjHH3UL8Gp7VNmrQGeqq-4YrDEk",

      authDomain:
        "amader-joypurhat-7b3fb.firebaseapp.com",

      projectId:
        "amader-joypurhat-7b3fb",

      storageBucket:
        "amader-joypurhat-7b3fb.firebasestorage.app",

      messagingSenderId:
        "542366008798",

      appId:
        "1:542366008798:web:4f9a7c210b561406a5494f"

    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);


    const params =
      new URLSearchParams(
        window.location.search
      );


    const categoryId =
      params.get("id");


    /* =========================
       LOAD DATA
       ========================= */

    async function loadData() {

      const categoryBox =
        document.getElementById(
          "categoryBox"
        );


      const upazilaList =
        document.getElementById(
          "upazilaList"
        );


      const contents =
        document.getElementById(
          "contents"
        );


      if (!categoryId) {

        categoryBox.innerHTML = `
          <div class="error">
            Topic পাওয়া যায়নি।
          </div>
        `;

        return;
      }


      try {

        /* =========================
           CATEGORY
           ========================= */

        const categorySnapshot =
          await getDocs(
            collection(
              db,
              "categories"
            )
          );


        let categoryData = null;


        categorySnapshot.forEach(
          (doc) => {

            if (
              doc.id === categoryId
            ) {

              categoryData =
                doc.data();

            }

          }
        );


        if (!categoryData) {

          categoryBox.innerHTML = `
            <div class="error">
              Topic পাওয়া যায়নি।
            </div>
          `;

          return;
        }


        categoryBox.innerHTML = `

          <div class="title">

            <div class="icon">
              ${categoryData.icon || "📌"}
            </div>

            <h2>
              ${categoryData.name || ""}
            </h2>

            <p>
              ${categoryData.description || ""}
            </p>

          </div>

        `;


        /* =========================
           CONTENTS
           ========================= */

        const contentSnapshot =
          await getDocs(
            collection(
              db,
              "contents"
            )
          );


        const allContents = [];


        contentSnapshot.forEach(
          (doc) => {

            const data =
              doc.data();


            if (
              data.categoryId ===
              categoryId
            ) {

              allContents.push({

                id: doc.id,

                ...data

              });

            }

          }
        );


        /* =========================
           UPAZILA
           ========================= */

        const isUpazila =
          categoryData.name &&
          categoryData.name.includes(
            "উপজেলার"
          );


        if (isUpazila) {

          showUpazilaList(
            upazilaList,
            contents,
            allContents
          );

        } else {

          showAllContents(
            contents,
            allContents
          );

        }


      } catch (error) {

        console.error(error);


        categoryBox.innerHTML = `

          <div class="error">

            তথ্য লোড করা যাচ্ছে না।

          </div>

        `;

      }

    }


    /* =========================
       UPAZILA LIST
       ========================= */

    function showUpazilaList(
      upazilaList,
      contents,
      allContents
    ) {

      upazilaList.innerHTML = `

        <div class="section-title">
          🏘️ উপজেলা সমূহ
        </div>

      `;


      const upazilas = [

        "জয়পুরহাট সদর উপজেলা",

        "পাঁচবিবি উপজেলা",

        "আক্কেলপুর উপজেলা",

        "কালাই উপজেলা",

        "ক্ষেতলাল উপজেলা"

      ];


      upazilas.forEach(
        (name) => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "card";


          card.innerHTML = `

            <div class="icon">
              🏘️
            </div>

            <h3>
              ${name}
            </h3>

            <p>
              বিস্তারিত তথ্য দেখতে চাপ দিন
            </p>

          `;


          card.onclick = () => {

            showUpazila(
              name,
              allContents
            );

          };


          upazilaList.appendChild(
            card
          );

        }
      );


      contents.innerHTML = `

        <div class="loading">

          উপরের তালিকা থেকে
          একটি উপজেলা নির্বাচন করুন।

        </div>

      `;

    }


    /* =========================
       SHOW UPAZILA
       ========================= */

    function showUpazila(
      name,
      allContents
    ) {

      const contents =
        document.getElementById(
          "contents"
        );


      const matched =
        allContents.filter(
          (item) => {

            if (!item.title) {
              return false;
            }


            return item.title
              .trim()
              .includes(name);

          }
        );


      if (
        matched.length === 0
      ) {

        contents.innerHTML = `

          <div class="info-section">

            <div class="info-heading">
              🏘️ ${name}
            </div>

            <div class="info-text">
              এই উপজেলার তথ্য এখনো যোগ করা হয়নি।
            </div>

          </div>

        `;

        return;

      }


      /*
       উপজেলা Header
      */

      contents.innerHTML = `

        <div class="title">

          <div class="icon">
            🏘️
          </div>

          <h2>
            ${name}
          </h2>

        </div>

      `;


      /*
       প্রতিটি Content-এর
       paragraph/section আলাদা করবে
      */

      matched.forEach(
        (item) => {

          createSections(
            contents,
            item.content || ""
          );

        }
      );


      setTimeout(
        () => {

          window.scrollTo({

            top:
              contents.offsetTop - 15,

            behavior:
              "smooth"

          });

        },
        100
      );

    }


    /* =========================
       CREATE SECTIONS
       ========================= */

    function createSections(
      container,
      text
    ) {

      /*
       দুই বা তার বেশি newline
       দিয়ে paragraph আলাদা করা হবে
      */

      const sections =
        text
          .split(/\n\s*\n/)
          .map(
            section =>
              section.trim()
          )
          .filter(
            section =>
              section.length > 0
          );


      sections.forEach(
        (section) => {

          const lines =
            section.split("\n");


          const heading =
            lines[0].trim();


          const body =
            lines
              .slice(1)
              .join("\n")
              .trim();


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "info-section";


          if (body) {

            card.innerHTML = `

              <div class="info-heading">
                ${heading}
              </div>

              <div class="info-text">
                ${body}
              </div>

            `;

          } else {

            card.innerHTML = `

              <div class="info-heading">
                ${heading}
              </div>

            `;

          }


          container.appendChild(
            card
          );

        }
      );

    }


    /* =========================
       OTHER CATEGORY
       ========================= */

    function showAllContents(
      contents,
      allContents
    ) {

      contents.innerHTML = "";


      if (
        allContents.length === 0
      ) {

        contents.innerHTML = `

          <div class="loading">

            এই Topic-এর তথ্য
            এখনো যোগ করা হয়নি।

          </div>

        `;

        return;

      }


      allContents.forEach(
        (item) => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "info-section";


          card.innerHTML = `

            <div class="info-heading">
              ${item.title || ""}
            </div>

            <div class="info-text">
              ${item.content || ""}
            </div>

          `;


          contents.appendChild(
            card
          );

        }
      );

    }


    loadData();

  </script>

</body>
</html>
